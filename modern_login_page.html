<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back | Sign In</title>
    <!-- Load Tailwind CSS for clean, modern utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Google Font for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/60 to-slate-100 font-sans text-slate-800 flex items-center justify-center p-4 sm:p-6 lg:p-8 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Main Authentication Card Container -->
    <main class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-100 p-6 sm:p-10 transition-all duration-300">
        
        <!-- Brand Header & Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-brand-600 text-white shadow-lg shadow-brand-500/30 mb-4">
                <!-- Minimalist Geometric Logo SVG -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">Welcome back</h1>
            <p class="text-sm text-slate-500 mt-2">Enter your details below to access your workspace</p>
        </div>

        <!-- Global Feedback Alert Banner (Hidden by default) -->
        <div id="form-alert" role="alert" class="hidden mb-6 p-4 rounded-2xl text-sm font-medium flex items-start gap-3 transition-all duration-300">
            <span id="form-alert-icon" class="shrink-0 mt-0.5"></span>
            <span id="form-alert-message" class="leading-relaxed"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" novalidate class="space-y-5">
            
            <!-- Full Name Field -->
            <div>
                <label for="full-name" class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="full-name" 
                        name="fullName" 
                        autocomplete="name"
                        placeholder="Alex Morgan" 
                        required
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all duration-200"
                    >
                </div>
                <p id="name-error" class="hidden text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Email Address Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        autocomplete="email"
                        placeholder="alex@company.com" 
                        required
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all duration-200"
                    >
                </div>
                <p id="email-error" class="hidden text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Password Field -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                    <!-- Forgot Password Interactive Trigger -->
                    <button 
                        type="button" 
                        id="open-forgot-modal"
                        class="text-xs font-semibold text-brand-600 hover:text-brand-700 focus:outline-none focus:underline transition-colors p-1 -mr-1 rounded-lg"
                    >
                        Forgot Password?
                    </button>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        autocomplete="current-password"
                        placeholder="••••••••" 
                        required
                        class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all duration-200"
                    >
                    <!-- Show/Hide Password Toggle Button -->
                    <button 
                        type="button" 
                        id="toggle-password" 
                        aria-label="Toggle password visibility"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
                    >
                        <svg id="eye-icon-show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <svg id="eye-icon-hide" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                        </svg>
                    </button>
                </div>
                <p id="password-error" class="hidden text-xs text-rose-600 mt-1.5 font-medium"></p>
            </div>

            <!-- Remember Me Checkbox -->
            <div class="flex items-center justify-between pt-1">
                <label class="inline-flex items-center cursor-pointer select-none group">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500/30 transition cursor-pointer">
                    <span class="ml-2.5 text-sm text-slate-600 group-hover:text-slate-800 transition-colors">Keep me signed in</span>
                </label>
            </div>

            <!-- Primary Submit Button -->
            <button 
                type="submit" 
                id="submit-btn"
                class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-md shadow-brand-600/20 hover:shadow-lg hover:shadow-brand-600/30 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-600 transition-all duration-200 flex items-center justify-center gap-2"
            >
                <span id="submit-text">Sign In</span>
                <svg id="submit-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- Footer Sign-Up Link -->
        <p class="mt-8 text-center text-xs sm:text-sm text-slate-500">
            Don't have an account yet? 
            <a href="#signup" id="demo-signup-link" class="font-semibold text-brand-600 hover:text-brand-700 hover:underline transition-colors">Create an account</a>
        </p>
    </main>

    <!-- =====================================================================
         FORGOT PASSWORD MODAL OVERLAY
    ====================================================================== -->
    <div 
        id="forgot-modal" 
        role="dialog" 
        aria-modal="true" 
        aria-labelledby="modal-title"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs transition-opacity duration-300 opacity-0"
    >
        <!-- Modal Card -->
        <div id="forgot-modal-card" class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-6 sm:p-8 transform scale-95 transition-all duration-300 relative">
            
            <!-- Close Modal Button -->
            <button 
                type="button" 
                id="close-forgot-modal" 
                aria-label="Close modal"
                class="absolute top-5 right-5 p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <!-- Modal Header -->
            <div class="mb-6">
                <div class="inline-flex items-center justify-center w-11 h-11 rounded-2xl bg-indigo-50 text-brand-600 mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                    </svg>
                </div>
                <h2 id="modal-title" class="text-xl font-bold text-slate-900">Reset your password</h2>
                <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">
                    Enter the email address associated with your account and we'll send you a secure reset link.
                </p>
            </div>

            <!-- Modal Feedback Banner -->
            <div id="reset-alert" class="hidden mb-5 p-3.5 rounded-2xl text-xs sm:text-sm font-medium flex items-start gap-2.5">
                <span id="reset-alert-icon" class="shrink-0 mt-0.5"></span>
                <span id="reset-alert-message"></span>
            </div>

            <!-- Password Reset Form -->
            <form id="reset-form" novalidate class="space-y-4">
                <div>
                    <label for="reset-email" class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
                    <input 
                        type="email" 
                        id="reset-email" 
                        placeholder="alex@company.com" 
                        required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-600 transition-all"
                    >
                    <p id="reset-email-error" class="hidden text-xs text-rose-600 mt-1.5 font-medium"></p>
                </div>

                <div class="pt-2 flex flex-col sm:flex-row gap-3">
                    <button 
                        type="button" 
                        id="cancel-reset-btn"
                        class="w-full sm:w-1/3 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-xl transition-colors"
                    >
                        Cancel
                    </button>
                    <button 
                        type="submit" 
                        id="reset-submit-btn"
                        class="w-full sm:w-2/3 py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-brand-600/20 transition-all flex items-center justify-center gap-2"
                    >
                        <span id="reset-submit-text">Send Reset Link</span>
                        <svg id="reset-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- =====================================================================
         JAVASCRIPT VALIDATION & INTERACTIVITY
    ====================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements: Main Login Form ---
            const loginForm = document.getElementById('login-form');
            const nameInput = document.getElementById('full-name');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            const nameError = document.getElementById('name-error');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');

            const formAlert = document.getElementById('form-alert');
            const formAlertIcon = document.getElementById('form-alert-icon');
            const formAlertMessage = document.getElementById('form-alert-message');

            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const submitSpinner = document.getElementById('submit-spinner');

            // --- DOM Elements: Password Visibility Toggle ---
            const togglePasswordBtn = document.getElementById('toggle-password');
            const eyeIconShow = document.getElementById('eye-icon-show');
            const eyeIconHide = document.getElementById('eye-icon-hide');

            // --- DOM Elements: Forgot Password Modal ---
            const forgotModal = document.getElementById('forgot-modal');
            const forgotModalCard = document.getElementById('forgot-modal-card');
            const openForgotBtn = document.getElementById('open-forgot-modal');
            const closeForgotBtn = document.getElementById('close-forgot-modal');
            const cancelResetBtn = document.getElementById('cancel-reset-btn');
            
            const resetForm = document.getElementById('reset-form');
            const resetEmailInput = document.getElementById('reset-email');
            const resetEmailError = document.getElementById('reset-email-error');
            const resetAlert = document.getElementById('reset-alert');
            const resetAlertIcon = document.getElementById('reset-alert-icon');
            const resetAlertMessage = document.getElementById('reset-alert-message');
            const resetSubmitBtn = document.getElementById('reset-submit-btn');
            const resetSubmitText = document.getElementById('reset-submit-text');
            const resetSpinner = document.getElementById('reset-spinner');

            // --- Helper Functions ---

            /**
             * Validates standard email syntax
             */
            const isValidEmail = (email) => {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
            };

            /**
             * Displays or clears field-specific inline validation errors
             */
            const setFieldError = (inputEl, errorEl, message) => {
                if (message) {
                    errorEl.textContent = message;
                    errorEl.classList.remove('hidden');
                    inputEl.classList.add('border-rose-400', 'focus:border-rose-500', 'focus:ring-rose-500/20');
                    inputEl.classList.remove('border-slate-200', 'focus:border-brand-600', 'focus:ring-brand-500/20');
                } else {
                    errorEl.classList.add('hidden');
                    errorEl.textContent = '';
                    inputEl.classList.remove('border-rose-400', 'focus:border-rose-500', 'focus:ring-rose-500/20');
                    inputEl.classList.add('border-slate-200', 'focus:border-brand-600', 'focus:ring-brand-500/20');
                }
            };

            /**
             * Displays a styled notification banner
             */
            const showBanner = (bannerEl, iconEl, msgEl, type, text) => {
                bannerEl.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200', 'border');
                
                if (type === 'success') {
                    bannerEl.classList.add('bg-emerald-50', 'text-emerald-800', 'border', 'border-emerald-200');
                    iconEl.innerHTML = `<svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                } else {
                    bannerEl.classList.add('bg-rose-50', 'text-rose-800', 'border', 'border-rose-200');
                    iconEl.innerHTML = `<svg class="w-5 h-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                }
                msgEl.textContent = text;
            };

            // --- Password Show/Hide Toggle ---
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIconShow.classList.toggle('hidden', isPassword);
                eyeIconHide.classList.toggle('hidden', !isPassword);
            });

            // --- Real-time Input Error Clearing ---
            nameInput.addEventListener('input', () => setFieldError(nameInput, nameError, ''));
            emailInput.addEventListener('input', () => setFieldError(emailInput, emailError, ''));
            passwordInput.addEventListener('input', () => setFieldError(passwordInput, passwordError, ''));
            resetEmailInput.addEventListener('input', () => setFieldError(resetEmailInput, resetEmailError, ''));

            // --- Login Form Submission Handler ---
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                formAlert.classList.add('hidden');

                let isValid = true;
                const nameVal = nameInput.value.trim();
                const emailVal = emailInput.value.trim();
                const passwordVal = passwordInput.value;

                // 1. Validate Full Name
                if (!nameVal) {
                    setFieldError(nameInput, nameError, 'Please enter your full name.');
                    isValid = false;
                } else if (nameVal.length < 2) {
                    setFieldError(nameInput, nameError, 'Name must be at least 2 characters long.');
                    isValid = false;
                }

                // 2. Validate Email
                if (!emailVal) {
                    setFieldError(emailInput, emailError, 'Email address is required.');
                    isValid = false;
                } else if (!isValidEmail(emailVal)) {
                    setFieldError(emailInput, emailError, 'Please enter a valid email address.');
                    isValid = false;
                }

                // 3. Validate Password
                if (!passwordVal) {
                    setFieldError(passwordInput, passwordError, 'Please enter your password.');
                    isValid = false;
                } else if (passwordVal.length < 6) {
                    setFieldError(passwordInput, passwordError, 'Password must be at least 6 characters.');
                    isValid = false;
                }

                if (!isValid) return;

                // Simulate asynchronous login request
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
                submitText.textContent = 'Signing in...';
                submitSpinner.classList.remove('hidden');

                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    submitText.textContent = 'Sign In';
                    submitSpinner.classList.add('hidden');

                    showBanner(
                        formAlert,
                        formAlertIcon,
                        formAlertMessage,
                        'success',
                        `Welcome back, ${nameVal}! You have successfully signed in with ${emailVal}.`
                    );
                }, 900);
            });

            // --- Forgot Password Modal Controls ---
            const openModal = () => {
                // Pre-fill reset email if user already typed one in the main form
                if (emailInput.value.trim() && isValidEmail(emailInput.value.trim())) {
                    resetEmailInput.value = emailInput.value.trim();
                }
                resetAlert.classList.add('hidden');
                setFieldError(resetEmailInput, resetEmailError, '');

                forgotModal.classList.remove('hidden');
                // Trigger CSS transition on next frame
                requestAnimationFrame(() => {
                    forgotModal.classList.remove('opacity-0');
                    forgotModalCard.classList.remove('scale-95');
                    forgotModalCard.classList.add('scale-100');
                });
                resetEmailInput.focus();
            };

            const closeModal = () => {
                forgotModal.classList.add('opacity-0');
                forgotModalCard.classList.remove('scale-100');
                forgotModalCard.classList.add('scale-95');
                setTimeout(() => {
                    forgotModal.classList.add('hidden');
                }, 250);
            };

            openForgotBtn.addEventListener('click', openModal);
            closeForgotBtn.addEventListener('click', closeModal);
            cancelResetBtn.addEventListener('click', closeModal);

            // Close modal on backdrop click
            forgotModal.addEventListener('click', (e) => {
                if (e.target === forgotModal) closeModal();
            });

            // Close modal on Escape key press
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !forgotModal.classList.contains('hidden')) {
                    closeModal();
                }
            });

            // --- Reset Password Form Submission ---
            resetForm.addEventListener('submit', (e) => {
                e.preventDefault();
                resetAlert.classList.add('hidden');

                const resetEmailVal = resetEmailInput.value.trim();

                if (!resetEmailVal) {
                    setFieldError(resetEmailInput, resetEmailError, 'Please enter your registered email address.');
                    return;
                }
                if (!isValidEmail(resetEmailVal)) {
                    setFieldError(resetEmailInput, resetEmailError, 'Please enter a valid email address.');
                    return;
                }

                // Simulate sending reset link
                resetSubmitBtn.disabled = true;
                resetSubmitText.textContent = 'Sending...';
                resetSpinner.classList.remove('hidden');

                setTimeout(() => {
                    resetSubmitBtn.disabled = false;
                    resetSubmitText.textContent = 'Send Reset Link';
                    resetSpinner.classList.add('hidden');

                    showBanner(
                        resetAlert,
                        resetAlertIcon,
                        resetAlertMessage,
                        'success',
                        `Password reset instructions have been sent to ${resetEmailVal}. Please check your inbox.`
                    );
                }, 850);
            });

            // Demo feedback for "Create an account" link
            document.getElementById('demo-signup-link').addEventListener('click', (e) => {
                e.preventDefault();
                showBanner(
                    formAlert,
                    formAlertIcon,
                    formAlertMessage,
                    'success',
                    'Registration view triggered — you can link this anchor to your sign-up route.'
                );
            });
        });
    </script>
</body>
</html>
